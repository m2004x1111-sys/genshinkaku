# 腾讯云轻量服务器 nginx 站点配置（kakuyomub2-genshin）
# 由 deploy/setup-nginx.sh 自动安装到 /etc/nginx/sites-available/genshinkaku
server {
    listen 80;
    server_name gk.longlian.online kakurd.longlian.online;
    client_max_body_size 6m;

    # SSL 证书文件验证目录（Tencent Cloud DCV）
    # 验证文件放到 /var/www/well-known/pki-validation/ 即可通过 http 访问
    location ^~ /.well-known/ {
        alias /var/www/well-known/;
        default_type text/plain;
    }

    # 应用反向代理 → 本地 server.js (5174)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 流式音频：关闭缓冲，加长超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
